name: loopit_minis
description: >
  Standalone Minis package (capture API, video hub, session). Lives outside
  LoopIt at repo root. Example app: flutter run from example/ — capture is home.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.loopit.minis
        pluginClass: LoopitMinisPlugin
      ios:
        pluginClass: LoopitMinisPlugin
